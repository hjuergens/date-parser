[project]
name = "date-rule-antlr-python"
version = "0.0.1"
description = "The shared schedule example parsed with ANTLR 4's Python target"
requires-python = ">=3.13"
dependencies = [
    "antlr4-python3-runtime==4.13.2",
    "hijridate>=2.6.0",
    "lunardate>=0.3.0",
    "pyluach>=2.3.0",
]

[dependency-groups]
dev = [
    "antlr4-tools>=0.2.2",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
