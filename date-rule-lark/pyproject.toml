[project]
name = "date-rule-lark"
version = "0.0.1"
description = "The shared schedule example parsed with Lark, in Earley and in LALR mode"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "hijridate>=2.6.0",
    "lark>=1.3.1",
    "lunardate>=0.3.0",
    "pyluach>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lark_schedule"]   # the grammars (*.lark) are package data inside it

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
