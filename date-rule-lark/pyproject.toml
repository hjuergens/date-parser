[project]
name = "date-rule-lark"
version = "0.0.1"
description = "The shared schedule example parsed with Lark, in Earley and in LALR mode"
requires-python = ">=3.13"
dependencies = [
    "hijridate>=2.6.0",
    "lark>=1.3.1",
    "lunardate>=0.3.0",
    "pyluach>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
