[package]
name = "pest_schedule"
version = "0.0.1"
edition = "2021"
description = "The shared date schedule language parsed with pest"
license = "Apache-2.0"
publish = false
build = "build.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
pest = "2"
pest_derive = "2"
