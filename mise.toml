# Toolchains and tasks for all modules:  mise install && mise run test
# Every module builds with its native tool; Maven builds only the Java and Scala modules.

[tools]
java = "temurin-17.0.21+9"
maven = "3.10.0"
node = "24.22.2"
python = "3.13.18"
uv = "0.13.5"

[tasks.test]
description = "Test all modules (the tasks below run in parallel)"
depends = ["test:jvm", "test:peg", "test:lark", "test:antlr-python", "test:flex-bison"]

[tasks."test:jvm"]
description = "Java and Scala modules; date-rule-bison only if /usr/bin/bison exists"
run = "mvn -B verify"

[tasks."test:peg"]
description = "Peggy (JavaScript)"
dir = "{{config_root}}/date-rule-peg"
run = ["npm ci --no-audit --no-fund", "npm test"]

[tasks."test:lark"]
description = "Lark (Python), Earley and LALR"
dir = "{{config_root}}/date-rule-lark"
run = "uv run pytest"

[tasks."generate:antlr-python"]
description = "Generate the Python parser from DateSchedule.g4"
dir = "{{config_root}}/date-rule-antlr-python"
run = "uv run antlr4 -v 4.13.2 -Dlanguage=Python3 -visitor -no-listener -Xexact-output-dir -o src/antlr_schedule/generated DateSchedule.g4"
sources = ["DateSchedule.g4"]
outputs = ["src/antlr_schedule/generated/DateScheduleParser.py"]

[tasks."test:antlr-python"]
description = "ANTLR 4, Python target"
dir = "{{config_root}}/date-rule-antlr-python"
depends = ["generate:antlr-python"]
run = "uv run pytest"

[tasks."test:flex-bison"]
description = "Flex + Bison (C); skipped without cc, flex and bison (the module's Dockerfile has them)"
dir = "{{config_root}}/date-rule-flex-bison"
run = "if command -v cc && command -v flex && command -v bison; then make test; else echo 'skipped: needs cc, flex and bison'; fi"

[tasks.docs]
description = "Regenerate docs/index.html"
run = "python docs/generate.py"
